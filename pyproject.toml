[project]
name = "vcmi-mapgen"
version = "0.1.0"
description = "Learned procedural map generator for VCMI"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",  # editor-quality H3 sprite rendering (vcmi_mapgen/render_editor.py)
    "numpy>=1.26",  # terrain segmentation + zone transform math
]

# pytest in the PROJECT env; uv installs the `dev` group by default for `uv run`/`uv sync`.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "basedpyright>=1.20",
    "pytest-xdist>=3.8.0",
]

# Everything else is the Python standard library. Run via uv, e.g.:
#   uv run python -m vcmi_mapgen.zone_engine run "All for One"
#   uv run python -m vcmi_mapgen.markov_terrain
#   uv run pytest
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PL", "RUF", "C90"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["vcmi_mapgen"]

[tool.pytest.ini_options]
testpaths = ["vcmi_mapgen"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
addopts = "-m 'not slow'"
markers = ["slow: a whole-pipeline seed sweep, run by `make sweep`"]
