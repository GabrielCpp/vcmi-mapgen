[project]
name = "vcmi-mapgen"
version = "0.1.0"
description = "Learned procedural map generator for VCMI"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",  # editor-quality H3 sprite rendering (vcmi_mapgen/render_editor.py)
    "numpy>=1.26",  # terrain segmentation + zone transform math
    "numba>=0.68.0",
]

# pytest in the PROJECT env; uv installs the `dev` group by default for `uv run`/`uv sync`.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "basedpyright>=1.20",
    "pytest-xdist>=3.8.0",
    "import-linter>=2.15",
]

# Everything else is the Python standard library. Run via uv, e.g.:
#   uv run python -m vcmi_mapgen.zone_engine run "All for One"
#   uv run python -m vcmi_mapgen.markov_terrain
#   uv run pytest
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PL", "RUF", "C90"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["vcmi_mapgen"]

[tool.pytest.ini_options]
testpaths = ["vcmi_mapgen"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
addopts = "-m 'not slow and not golden'"
markers = [
    "slow: a whole-pipeline seed sweep, run by `make sweep`",
    "golden: the generated-map hash oracle, run by `make golden`",
]

[tool.importlinter]
root_package = "vcmi_mapgen"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers run from the command line down to the model"
type = "layers"
layers = [
    "vcmi_mapgen.cli",
    "vcmi_mapgen.renderers",
    "vcmi_mapgen.corpus",
    "vcmi_mapgen.vcmi",
    "vcmi_mapgen.core.steps",
    "vcmi_mapgen.core.pipeline",
    "vcmi_mapgen.core.planning",
    "vcmi_mapgen.core.reading",
    "vcmi_mapgen.core.placement",
    "vcmi_mapgen.core.grid",
    "vcmi_mapgen.core.catalog | vcmi_mapgen.core.priors",
    "vcmi_mapgen.core.model",
]
ignore_imports = ["vcmi_mapgen.** -> vcmi_mapgen.conftest"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Core imports only core, the standard library, numpy and numba"
type = "forbidden"
source_modules = ["vcmi_mapgen.core"]
forbidden_modules = [
    "vcmi_mapgen.cli",
    "vcmi_mapgen.renderers",
    "vcmi_mapgen.corpus",
    "vcmi_mapgen.vcmi",
    "PIL",
]
allow_indirect_imports = "true"
ignore_imports = ["vcmi_mapgen.** -> vcmi_mapgen.conftest"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "A step imports another step only through its result module"
type = "independence"
modules = [
    "vcmi_mapgen.core.steps.gameplay",
    "vcmi_mapgen.core.steps.gated",
    "vcmi_mapgen.core.steps.loot",
    "vcmi_mapgen.core.steps.portal",
    "vcmi_mapgen.core.steps.roads",
    "vcmi_mapgen.core.steps.scatter",
    "vcmi_mapgen.core.steps.sets",
    "vcmi_mapgen.core.steps.terrain_gen",
    "vcmi_mapgen.core.steps.treasure",
    "vcmi_mapgen.core.steps.vegetation",
]
ignore_imports = [
    "vcmi_mapgen.core.steps.** -> vcmi_mapgen.core.steps.*.result",
    "vcmi_mapgen.** -> vcmi_mapgen.conftest",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only the command line reads the corpus maps and runs the miners"
type = "protected"
protected_modules = ["vcmi_mapgen.corpus.maps", "vcmi_mapgen.corpus.mine"]
allowed_importers = [
    "vcmi_mapgen.cli",
    "vcmi_mapgen.corpus.mine",
    "vcmi_mapgen.corpus.maps_test",
    "vcmi_mapgen.conftest",
]
